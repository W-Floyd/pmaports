# The CAMSS v4l2 nodes emit raw Bayer, which GNOME apps cannot decode. Use the
# libcamera monitor instead so the SoftISP debayers before the stream is
# published, and take the raw v4l2 nodes out of the way.
wireplumber.profiles = {
  main = {
    monitor.libcamera = required
    monitor.v4l2 = disabled
  }
}
