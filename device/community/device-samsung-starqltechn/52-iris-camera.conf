# The S5K5F1 is the infrared iris-recognition sensor, not a general purpose
# camera. libcamera reports it as front facing, so it arrives with the same
# "Built-in Front Camera" description as the IMX320 selfie camera and at the
# same session priority.
#
# Two cameras sharing one name makes name-based camera restore ambiguous, and
# an application that falls back to the first or default camera gets an IR
# sensor whose GRAY8 2400x2400 stream camerabin cannot negotiate. GNOME
# Snapshot hangs on launch when it lands there: "Format negotiation failed",
# then not-negotiated (-4).
#
# Give it a name of its own and the lowest priority. It stays available to
# anything that asks for it by name.
monitor.libcamera.rules = [
  {
    matches = [
      { node.nick = "s5k5f1" }
    ]
    actions = {
      update-props = {
        node.description = "Built-in Iris Camera"
        priority.session = 100
      }
    }
  }
]
