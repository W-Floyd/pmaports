clk_ignore_unused
console=tty0
pmos.nosplash

# Debug UART: qupv3_se4_2uart / uart4 @0x4a90000, gpio12+13 on function qup4.
# khaje.dtsi upstream asks for ttyMSM0,115200n8 and ABL overrides it with
# console=null on stock, which is why the retail phone looks console-less.
#
# Note the DTS chosen/bootargs does NOT reach the kernel: the bootloader passes
# the boot image's cmdline, which boot-deploy generates from these files.
# earlycon/console on the geni UART are REMOVED for now.
#
# earlycon maps and writes UART registers in setup_arch(), long before any
# clock driver runs. Stock boots console=null, so ABL has no reason to leave
# the geni UART clocked -- and writing an unclocked Qualcomm peripheral hangs
# the CPU instantly, before fbcon or any printk. That would produce exactly the
# observed failure: silence on every channel.
#
# Re-add once the UART is known to be clocked (or once gcc-sm6115 is confirmed
# to work on khaje):
#   earlycon=qcom_geni,0x4a90000
#   console=ttyMSM0,115200n8

# 00-base.conf sets `quiet`, which caps loglevel at 4 and hides exactly what a
# first boot needs to show. 20-plymouth.conf sets `splash`, which would cover
# the framebuffer console. Remove both rather than fighting them with ordering.
-quiet
-splash
loglevel=7
