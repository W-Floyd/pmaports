clk_ignore_unused
console=tty0
pmos.nosplash

# Debug UART: qupv3_se4_2uart / uart4 @0x4a90000, gpio12+13 on function qup4.
# khaje.dtsi upstream asks for ttyMSM0,115200n8 and ABL overrides it with
# console=null on stock, which is why the retail phone looks console-less.
#
# Note the DTS chosen/bootargs does NOT reach the kernel: the bootloader passes
# the boot image's cmdline, which boot-deploy generates from these files.
# earlycon/console on the geni UART are REMOVED for now.
#
# earlycon maps and writes UART registers in setup_arch(), long before any
# clock driver runs. Stock boots console=null, so ABL has no reason to leave
# the geni UART clocked -- and writing an unclocked Qualcomm peripheral hangs
# the CPU instantly, before fbcon or any printk. That would produce exactly the
# observed failure: silence on every channel.
#
# Re-add once the UART is known to be clocked (or once gcc-sm6115 is confirmed
# to work on khaje):
#   earlycon=qcom_geni,0x4a90000
#   console=ttyMSM0,115200n8

# 00-base.conf sets `quiet`, which caps loglevel at 4 and hides exactly what a
# first boot needs to show. 20-plymouth.conf sets `splash`, which would cover
# the framebuffer console. Remove both rather than fighting them with ordering.
-quiet
-splash
loglevel=7

# Force fbcon onto fb0. simple-framebuffer clears the panel to black when it
# probes, which is visible -- but with CONFIG_LOGO=y a successful fbcon bind
# also draws the Tux penguin, and we see black with no penguin. That points at
# fbcon not attaching rather than the framebuffer being wrong.
fbcon=map:0

# A panic must HANG, not reboot. CONFIG_PANIC_TIMEOUT=0 is not enough: it is
# only the default, and the cmdline wins. Stock's own cmdline carries panic=5
# (verified: /proc/cmdline on a running retail build), so anything inheriting
# it reboots five seconds after dying -- which is exactly what a RAM-booted
# kernel here looked like, and why the reset was misread as a watchdog bite
# rather than a panic. Pin it so "hangs forever" and "resets" stay distinct
# failure modes.
panic=0

# The GKI generic ramdisk in `init_boot` is prepended to our vendor ramdisk and
# its /init wins, so pmOS's init must be reached under another name. mkboot.sh
# copies init -> init.pmos for the U-Boot path; boot-deploy packs the same
# initramfs artifact, so the same redirect is needed here. Without it the phone
# runs the GKI init and never reaches pmOS.
rdinit=/init.pmos

# No qbootctl yet and slot A is active. msm-firmware-loader needs the suffix to
# resolve paths under the vendor partition; without it no firmware is found.
androidboot.slot_suffix=_a

# BRINGUP BISECT -- REMOVED 2026-09-12.
#
# `nosmp maxcpus=1` lived here to rule out PSCI CPU_ON as the source of an early
# reset, from a time when no kernel booted on this device by any route. That
# question is now settled from the other direction: this same kernel and DTB boot
# on all cores via the U-Boot FIT. Keeping the bisect would have shipped a
# single-core phone and, worse, made a successful boot look like a degraded one.
#
# mem= was tried here too and was removed earlier: it confines the kernel to a low
# window, but ABL may place the DTB and the 12 MiB initramfs high in DDR, so
# `mem=` can cut the kernel off from its own initramfs and fail for a reason that
# has nothing to do with the region under test. Not a clean experiment.
