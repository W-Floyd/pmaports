# Drop-in for hexagonrpcd-adsp-sensorspd.service: serve the tree
# fogona-hexagonfs.service builds, instead of the absent default
# /usr/share/qcom/<soc>/<vendor>/<device>. The Requires= is what starts
# fogona-hexagonfs, so that unit needs no [Install] section of its own.
[Unit]
Requires=fogona-hexagonfs.service
After=fogona-hexagonfs.service

[Service]
ExecStart=
ExecStart=/usr/bin/hexagonrpcd -f /dev/fastrpc-adsp -d adsp -s -R /run/hexagonfs
