# Serve the ADSP's dynamic modules (the dsp partition's adsp/ directory) to
# the audio PD: the voice TX graph loads Fluence ECNS modules over FastRPC.
[Unit]
After=msm-firmware-loader.service
Wants=msm-firmware-loader.service

[Service]
RuntimeDirectory=hexagonfs-rootpd
ExecStartPre=/bin/ln -sfn /run/msm-firmware-loader/mnt/dsp_a /run/hexagonfs-rootpd/dsp
ExecStart=
ExecStart=/usr/bin/hexagonrpcd -f /dev/fastrpc-adsp -d adsp -R /run/hexagonfs-rootpd
