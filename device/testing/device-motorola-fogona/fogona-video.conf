# fogona: pick iris, not venus, for the video codec.
#
# video-codec@5a00000 is compatible with "qcom,sm6225-venus", "qcom,qcm2290-venus",
# and BOTH drivers match it -- whichever loads first binds the device, which
# makes "which codec driver is in use" depend on module load order rather than on
# anything intentional.
#
# iris is the one that works here. This firmware speaks HFI Gen2 and mainline
# venus only implements Gen1, so venus gets as far as booting the core and then
# times out; iris implements both, detects the generation from the image, and
# brings the core up (SYS_INIT completes and the firmware answers
# HFI_PROP_IMAGE_VERSION). See /repo/investigations/venus-video.md.
#
# Blacklisting only prevents automatic loading, so `modprobe venus_core` still
# works if you want to compare the two by hand -- rmmod qcom_iris first.
blacklist venus_core
