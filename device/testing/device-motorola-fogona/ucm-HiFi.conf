# Two AW88261 amplifiers on primary MI2S, one channel each: the bottom
# speaker ("Speaker" pin) and the earpiece ("Receiver" pin). Media plays in
# stereo across both; calls use the earpiece alone. The pin switches gate
# each amplifier through the DT's audio-routing.
#
# No ConflictingDevice between the two, although only one is active at a
# time: with it, PipeWire splits them into separate profiles, and callaudiod
# only switches between speaker and earpiece ports of one sink.

SectionVerb {
	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	EnableSequence [
		cset "name='Speaker Switch' 1"
		cset "name='Receiver Switch' 1"
	]

	DisableSequence [
		cset "name='Speaker Switch' 0"
		cset "name='Receiver Switch' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"

	EnableSequence [
		cset "name='Speaker Switch' 0"
		cset "name='Receiver Switch' 1"
	]

	DisableSequence [
		cset "name='Receiver Switch' 0"
	]

	Value {
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}
