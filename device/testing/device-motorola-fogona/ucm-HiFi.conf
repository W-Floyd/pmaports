# Two AW88261 amplifiers on primary MI2S, one channel each: the earpiece
# ("Receiver" pin) takes the left channel, the bottom speaker ("Speaker"
# pin) the right. Media plays in stereo across both. The earpiece alone is
# only in VoiceCall.conf: it plays just the left channel, which suits mono
# voice (PipeWire copies it to both channels) but not stereo media.

SectionVerb {
	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	EnableSequence [
		cset "name='Speaker Switch' 1"
		cset "name='Receiver Switch' 1"
	]

	DisableSequence [
		cset "name='Speaker Switch' 0"
		cset "name='Receiver Switch' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}