# Two AW88261 amplifiers on primary MI2S, one channel each: the bottom
# speaker ("Speaker") and the earpiece ("Receiver"). Media plays in stereo
# across both. The earpiece-only call path is not described yet.

SectionVerb {
	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	EnableSequence [
		cset "name='Speaker Switch' 1"
		cset "name='Receiver Switch' 1"
	]

	DisableSequence [
		cset "name='Speaker Switch' 0"
		cset "name='Receiver Switch' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}
