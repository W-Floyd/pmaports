[Service]
# The stock command is `udevadm trigger --type=all`, which replays ~2500
# entries (8 s of CPU on this handset), 1400 of them /sys/bus drivers and
# /sys/module objects that no rule looks at but four: the module entries
# block (media polling), configfs and fuse (their mounts) and parport_pc.
# Trigger those by name, then the devices alone, skipping the 248 devlink
# devices nothing matches.
ExecStart=
ExecStart=-udevadm trigger --type=subsystems --action=add --subsystem-match=module --sysname-match=block --sysname-match=configfs --sysname-match=fuse --sysname-match=parport_pc
ExecStart=-udevadm trigger --type=devices --action=add --subsystem-nomatch=devlink --prioritized-subsystem=block,tpmrm,net,tty,input
