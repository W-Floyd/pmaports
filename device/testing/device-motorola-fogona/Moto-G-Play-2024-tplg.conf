# AudioReach topology for Motorola fogona -- speaker playback over primary MI2S.
#
# Compile with:
#   alsatplg -c topology/fogona.conf -o Moto-G-Play-2024-tplg.bin
# and install as /lib/firmware/qcom/sm6225/Moto-G-Play-2024-tplg.bin. The path
# is built by audioreach_tplg_init() as qcom/<card driver_name>/<card name>-tplg.bin,
# so it follows fogona_priv_data.driver_name ("sm6225") and the DT model
# ("Moto-G-Play-2024"). Change either and this filename changes with it.
#
# WHY THIS FILE EXISTS AT ALL. q6apm_audio_probe() calls audioreach_tplg_init(),
# which request_firmware()s a topology and fails the whole card without one.
# The topology *is* the DSP graph -- which modules exist, how they connect, and
# what each is configured with. Boards enabled by Qualcomm or Linaro ship one as
# a per-device blob; fogona has none, and the vendor's own graph lives in ACDB
# data in a format nothing mainline reads. So it is written by hand.
#
# WHERE THE VALUES COME FROM.
#   * token numbers          include/uapi/sound/snd_ar_tokens.h (check every
#                            entry of the token tables against it: a wrong
#                            number is silently ignored)
#   * module IDs             sound/soc/qcom/qdsp6/audioreach.h
#   * which widget type maps to which loader
#                            audioreach_widget_ready() in topology.c
#   * what each module is configured with
#                            audioreach_module_config() in audioreach.c
#   * graph shape            linux-msm/audioreach-topology (upstream m4
#                            topologies, several of them I2S boards)
#   * the I2S backend        stock: its ACDB and a GPR trace (out/stock-gpr)
#
# Container and sub-graph properties marked GUESS work, but are not taken
# from stock.

# THE ONE-ARRAY RULE, which cost a boot to find. The parser does not merge a
# widget's vendor arrays. audioreach_get_sg_array(), _get_cont_array() and
# _get_module_array() each scan for the *first array* containing one anchor
# token -- SUB_GRAPH_INSTANCE_ID, CONTAINER_INSTANCE_ID, MODULE_INSTANCE_ID --
# and then read only that array. A token placed in a sibling SectionData is
# silently ignored: it compiles, it loads, and it does nothing.
#
# So AR_TKN_DAI_INDEX has to sit beside SUB_GRAPH_INSTANCE_ID, and the I2S
# hardware tokens beside MODULE_INSTANCE_ID. Splitting them out "for tidiness"
# is what made both sub-graphs load with no graph attached, which then failed
# the PCM with -19 and oopsed on the way back out.
#
# ----------------------------------------------------------------- tokens ---

SectionVendorTokens."sg_tokens" {
	AR_TKN_DAI_INDEX			"1"
	AR_TKN_U32_SUB_GRAPH_INSTANCE_ID	"2"
	AR_TKN_U32_SUB_GRAPH_PERF_MODE		"3"
	AR_TKN_U32_SUB_GRAPH_DIRECTION		"4"
	AR_TKN_U32_SUB_GRAPH_SCENARIO_ID	"5"
}

SectionVendorTokens."cont_tokens" {
	AR_TKN_U32_CONTAINER_INSTANCE_ID	"100"
	AR_TKN_U32_CONTAINER_CAPABILITY_ID	"101"
	AR_TKN_U32_CONTAINER_STACK_SIZE		"102"
	AR_TKN_U32_CONTAINER_GRAPH_POS		"103"
	AR_TKN_U32_CONTAINER_PROC_DOMAIN	"104"
}

SectionVendorTokens."mod_tokens" {
	AR_TKN_U32_MODULE_ID			"200"
	AR_TKN_U32_MODULE_INSTANCE_ID		"201"
	AR_TKN_U32_MODULE_MAX_IP_PORTS		"202"
	AR_TKN_U32_MODULE_MAX_OP_PORTS		"203"
	AR_TKN_U32_MODULE_SRC_OP_PORT_ID	"206"
	AR_TKN_U32_MODULE_DST_IN_PORT_ID	"207"
	AR_TKN_U32_MODULE_SRC_INSTANCE_ID	"208"
	AR_TKN_U32_MODULE_DST_INSTANCE_ID	"209"
	AR_TKN_U32_MODULE_FMT_INTERLEAVE	"252"
	AR_TKN_U32_MODULE_FMT_DATA		"253"
	AR_TKN_U32_MODULE_HW_IF_IDX		"250"
	AR_TKN_U32_MODULE_HW_IF_TYPE		"251"
	AR_TKN_U32_MODULE_SD_LINE_IDX		"256"
	AR_TKN_U32_MODULE_WS_SRC		"257"
}

# ------------------------------------------------- sub-graph 1: frontend ---
# The MultiMedia1 playback path: the host writes PCM into a shared-memory
# endpoint, which feeds a PCM decoder. Direction 1 is RX/playback.

SectionVendorTuples."fe_sg_tuples" {
	tokens "sg_tokens"
	tuples."word" {
		AR_TKN_DAI_INDEX			"0"
		AR_TKN_U32_SUB_GRAPH_INSTANCE_ID	"0x4001"
		AR_TKN_U32_SUB_GRAPH_PERF_MODE		"2"	# matches a working topology
		AR_TKN_U32_SUB_GRAPH_DIRECTION		"2"	# RX (TX is 1)
		AR_TKN_U32_SUB_GRAPH_SCENARIO_ID	"1"	# APM_SUB_GRAPH_SID_AUDIO_PLAYBACK
	}
}

SectionData."fe_sg_data" {
	tuples "fe_sg_tuples"
}

SectionVendorTuples."fe_cont_tuples" {
	tokens "cont_tokens"
	tuples."word" {
		AR_TKN_U32_CONTAINER_INSTANCE_ID	"0x4001"
		AR_TKN_U32_CONTAINER_CAPABILITY_ID	"0x0B001001"	# PP; see note
		AR_TKN_U32_CONTAINER_STACK_SIZE		"8192"	# GUESS
		AR_TKN_U32_CONTAINER_GRAPH_POS		"1"	# GUESS: stream
		AR_TKN_U32_CONTAINER_PROC_DOMAIN	"2"	# ADSP, per GPR_DOMAIN_ID_ADSP
	}
}

SectionData."fe_cont_data" {
	tuples "fe_cont_tuples"
}

# MODULE_ID_WR_SHARED_MEM_EP 0x07001000 -- where the host writes PCM.
# Its output port 1 feeds the decoder's input port 2.
SectionVendorTuples."shmem_mod_tuples" {
	tokens "mod_tokens"
	tuples."word" {
		AR_TKN_U32_MODULE_ID			"0x07001000"
		AR_TKN_U32_MODULE_INSTANCE_ID		"0x6001"
		AR_TKN_U32_MODULE_MAX_IP_PORTS		"0"
		AR_TKN_U32_MODULE_MAX_OP_PORTS		"1"
		AR_TKN_U32_MODULE_SRC_OP_PORT_ID	"1"
		AR_TKN_U32_MODULE_SRC_INSTANCE_ID	"0x6001"
		AR_TKN_U32_MODULE_DST_INSTANCE_ID	"0x6002"
		AR_TKN_U32_MODULE_DST_IN_PORT_ID	"2"
	}
}

SectionData."shmem_mod_data" {
	tuples "shmem_mod_tuples"
}

# MODULE_ID_PCM_DEC 0x07001005 -- terminal module of the frontend sub-graph.
# Its downstream link is made at runtime by the FE/BE mixer control below,
# which is why it declares no destination here. Its PARAM_ID_PCM_OUTPUT_FORMAT_CFG
# takes `interleaved` from FMT_INTERLEAVE; left out it is 0, which is not a
# valid value and the DSP fails the frontend prepare. It must be 3
# (PCM_DEINTERLEAVED_UNPACKED), which is what stock's frontend container
# outputs. PCM crossing a container boundary has to be deinterleaved. With 1
# the container logs "container output media format: must be deinterleaved
# packed for PCM, but it is 1" and the backend container reads the interleaved
# buffer as deinterleaved: each channel alternates L and R samples, which
# sounds robotic and puts both channels on both amps. 2
# (PCM_DEINTERLEAVED_PACKED) crashes the ADSP's backend container at graph
# start.
SectionVendorTuples."pcmdec_mod_tuples" {
	tokens "mod_tokens"
	tuples."word" {
		AR_TKN_U32_MODULE_ID			"0x07001005"
		AR_TKN_U32_MODULE_INSTANCE_ID		"0x6002"
		AR_TKN_U32_MODULE_MAX_IP_PORTS		"1"
		AR_TKN_U32_MODULE_MAX_OP_PORTS		"1"
		AR_TKN_U32_MODULE_FMT_INTERLEAVE	"3"
	}
}

SectionData."pcmdec_mod_data" {
	tuples "pcmdec_mod_tuples"
}

# -------------------------------------------------- sub-graph 2: backend ---
# Primary MI2S RX. AR_TKN_DAI_INDEX ties this sub-graph to the port, and 16 is
# PRIMARY_MI2S_RX from dt-bindings/sound/qcom,q6dsp-lpass-ports.h -- the same
# value the board DTS hands to q6apmbedai.

SectionVendorTuples."be_sg_tuples" {
	tokens "sg_tokens"
	tuples."word" {
		AR_TKN_DAI_INDEX			"16"
		AR_TKN_U32_SUB_GRAPH_INSTANCE_ID	"0x4002"
		AR_TKN_U32_SUB_GRAPH_PERF_MODE		"2"	# matches a working topology
		AR_TKN_U32_SUB_GRAPH_DIRECTION		"2"	# RX (TX is 1)
		AR_TKN_U32_SUB_GRAPH_SCENARIO_ID	"1"	# GUESS
	}
}

SectionData."be_sg_data" {
	tuples "be_sg_tuples"
}

SectionVendorTuples."be_cont_tuples" {
	tokens "cont_tokens"
	tuples."word" {
		AR_TKN_U32_CONTAINER_INSTANCE_ID	"0x4002"
		AR_TKN_U32_CONTAINER_CAPABILITY_ID	"0x0B001001"	# PP; see note
		AR_TKN_U32_CONTAINER_STACK_SIZE		"8192"	# GUESS
		AR_TKN_U32_CONTAINER_GRAPH_POS		"2"	# GUESS: device
		AR_TKN_U32_CONTAINER_PROC_DOMAIN	"2"	# ADSP, per GPR_DOMAIN_ID_ADSP
	}
}

SectionData."be_cont_data" {
	tuples "be_cont_tuples"
}

# MODULE_ID_I2S_SINK 0x0700100A.
#
# Stock's values: its backend is MI2S-LPAIF_VA-RX-PRIMARY, so hw_if_type 3
# (LPAIF_VA), hw_if_idx 0 (I2S_INTF_TYPE_PRIMARY), and its ACDB's
# device_hw_ep_rx tag gives sd_line_idx 1 (I2S_SD0) and ws_src 1 (internal).
# Mainline passes these straight into PARAM_ID_I2S_INTF_CFG. ws_src is
# overwritten by the driver from the DAI format (BP_FP -> internal), so the
# value here is inert.
SectionVendorTuples."i2s_mod_tuples" {
	tokens "mod_tokens"
	tuples."word" {
		AR_TKN_U32_MODULE_ID			"0x0700100A"
		AR_TKN_U32_MODULE_INSTANCE_ID		"0x6003"
		AR_TKN_U32_MODULE_MAX_IP_PORTS		"1"
		AR_TKN_U32_MODULE_MAX_OP_PORTS		"0"
		AR_TKN_U32_MODULE_FMT_DATA		"1"	# DATA_FORMAT_FIXED_POINT
		AR_TKN_U32_MODULE_HW_IF_IDX		"0"
		AR_TKN_U32_MODULE_HW_IF_TYPE		"3"
		AR_TKN_U32_MODULE_SD_LINE_IDX		"1"
		AR_TKN_U32_MODULE_WS_SRC		"1"
	}
}

SectionData."i2s_mod_data" {
	tuples "i2s_mod_tuples"
}

# MODULE_ID_PCM_CNV 0x07001003, ahead of the I2S sink in the backend sub-graph.
# The frontend decoder emits the frontend's format (S16_LE) and the sink runs
# at the backend's (32 bit, as stock), and SPF passes no data across that
# mismatch: the graph starts and no buffer ever comes back. Modules in the
# backend graph are configured with the backend format
# (q6apm_lpass_dai_prepare), so this converter outputs 32 bit. Interleave 3,
# PCM_DEINTERLEAVED_UNPACKED, as upstream's converters.
SectionVendorTuples."cnv_mod_tuples" {
	tokens "mod_tokens"
	tuples."word" {
		AR_TKN_U32_MODULE_ID			"0x07001003"
		AR_TKN_U32_MODULE_INSTANCE_ID		"0x6004"
		AR_TKN_U32_MODULE_MAX_IP_PORTS		"1"
		AR_TKN_U32_MODULE_MAX_OP_PORTS		"1"
		AR_TKN_U32_MODULE_SRC_OP_PORT_ID	"1"
		AR_TKN_U32_MODULE_SRC_INSTANCE_ID	"0x6004"
		AR_TKN_U32_MODULE_DST_INSTANCE_ID	"0x6003"
		AR_TKN_U32_MODULE_DST_IN_PORT_ID	"2"
		AR_TKN_U32_MODULE_FMT_INTERLEAVE	"3"
	}
}

SectionData."cnv_mod_data" {
	tuples "cnv_mod_tuples"
}

# ---------------------------------------------------------------- widgets ---
# Widget type decides which loader runs, per audioreach_widget_ready():
# aif_in/aif_out/buffer -> load_buffer, which is what dispatches on module_id
# and so is the one that handles MODULE_ID_I2S_SINK; decoder/encoder/src ->
# load_enc_dec_cnv.

SectionWidget."MM1 SHMEM RX" {
	index "1"
	type "aif_in"
	stream_name "MM1 Playback"
	no_pm "true"
	data [
		"fe_sg_data"
		"fe_cont_data"
		"shmem_mod_data"
	]
}

SectionWidget."MM1 PCM DEC" {
	index "1"
	type "decoder"
	no_pm "true"
	data [
		"fe_sg_data"
		"fe_cont_data"
		"pcmdec_mod_data"
	]
}

SectionWidget."PRI MI2S RX CNV" {
	index "1"
	type "src"
	no_pm "true"
	data [
		"be_sg_data"
		"be_cont_data"
		"cnv_mod_data"
	]
}

SectionWidget."PRI MI2S RX SINK" {
	index "1"
	type "aif_out"
	stream_name "Primary MI2S Playback"
	no_pm "true"
	data [
		"be_sg_data"
		"be_cont_data"
		"i2s_mod_data"
	]
}

# ----------------------------------------------------------------- routes ---
# The aif widgets carry stream_name rather than being routed to the DAIs by
# hand. snd_soc_dapm_link_dai_widgets() joins a DAI widget to an aif_in/aif_out
# whose stream name matches, which is how this graph meets the dai-links the
# machine driver declares -- "Primary MI2S Playback" is the playback stream of
# PRI_MI2S_RX in q6dsp-lpass-ports.c, and "MM1 Playback" is this file's own
# SectionPCMCapabilities name, which becomes the frontend stream name. An
# explicit route cannot express either: alsatplg rejects an endpoint it has no
# widget for.

# --------------------------------------------------- FE -> BE virtual mixer ---
# A route between two real modules does nothing: audioreach_route_load() only
# acts when exactly one end is a module. The frontend is joined to the backend
# through a virtual mixer instead, and the two halves carry different tokens.
#
# The mixer WIDGET is the backend side. audioreach_put_audio_mixer() passes it
# as m2, and audioreach_connect_sub_graphs() looks the graph up by
# m2->graph_id -- so its AR_TKN_DAI_INDEX is the backend port, 16.
#
# The mixer CONTROL is the frontend side, passed as m1, and only its
# module_instance_id is read. Its tokens therefore name the frontend sub-graph.
#
# Neither instance id is written here. Route 1 below makes the widget adopt the
# PCM converter's instance id, and route 2 makes the control adopt the PCM decoder's,
# which is the whole purpose of those two routes.

SectionVendorTuples."mixer_widget_tuples" {
	tokens "sg_tokens"
	tuples."word" {
		AR_TKN_DAI_INDEX			"16"
		AR_TKN_U32_SUB_GRAPH_INSTANCE_ID	"0x4002"
	}
}

SectionData."mixer_widget_data" {
	tuples "mixer_widget_tuples"
}

SectionVendorTuples."mixer_ctl_tuples" {
	tokens "sg_tokens"
	tuples."word" {
		AR_TKN_DAI_INDEX			"0"
		AR_TKN_U32_SUB_GRAPH_INSTANCE_ID	"0x4001"
	}
}

SectionData."mixer_ctl_data" {
	tuples "mixer_ctl_tuples"
}

# get/put 256 is SND_SOC_AR_TPLG_FE_BE_GRAPH_CTL_MIX, which is what makes
# audioreach_control_load() treat this as an FE/BE connection rather than a
# volume control.
SectionControlMixer."MultiMedia1" {
	index "1"

	channel."FL" {
		reg "-1"
		shift "0"
	}

	ops."ctl" {
		info "volsw"
		get "256"
		put "256"
	}

	max "1"
	invert "0"

	data [
		"mixer_ctl_data"
	]
}

SectionWidget."PRI_MI2S_RX Audio Mixer" {
	index "1"
	type "mixer"
	no_pm "true"

	mixer [
		"MultiMedia1"
	]

	data [
		"mixer_widget_data"
	]
}

# ----------------------------------------------------------------- routes ---
# Route 1 has a real module as sink and the virtual mixer as source, so
# audioreach_route_load() gives the mixer widget the PCM converter's instance id
# (the first module of the backend, where the frontend connects). The
# converter -> sink route is informational; that link comes from the
# converter's DST tuples.
# Route 2 has a real module as source, the mixer as sink and names a control,
# so the control takes the PCM decoder's instance id.

SectionGraph."fogona_playback" {
	index "1"

	lines [
		"MM1 PCM DEC, , MM1 SHMEM RX"
		"PRI MI2S RX CNV, , PRI_MI2S_RX Audio Mixer"
		"PRI MI2S RX SINK, , PRI MI2S RX CNV"
		"PRI_MI2S_RX Audio Mixer, MultiMedia1, MM1 PCM DEC"
	]
}

# ------------------------------------------------------------------- PCMs ---
# The frontend PCM comes from the topology, not from the machine driver's
# device tree: no board wires q6apmdai into a dai-link, because under
# AudioReach the FE is declared here.

SectionPCMCapabilities."MM1 Playback" {
	formats "S16_LE"
	rate_min "48000"
	rate_max "48000"
	channels_min "2"
	channels_max "2"
}

SectionPCM."MultiMedia1" {
	index "1"
	id "0"

	dai."MultiMedia1" {
		id "0"
	}

	pcm."playback" {
		capabilities "MM1 Playback"
	}
}

# --------------------------------------------------------------- manifest ---

SectionManifest."fogona_manifest" {
	data [
		"fe_sg_data"
	]
}

# ------------------------------------------------------ WHERE THIS STANDS ---
#
# Plays through the speakers (2026-09-24), with a 32-bit backend and the
# backend graph started in prepare on the kernel side
# (investigations/audio.md, "The speakers play"). The I2S values are stock's,
# from its ACDB and a GPR trace of stock playing a ringtone.
#
# Known on hardware:
#   MODULE_ID_AUDIO_IF_SINK is NOT in this firmware: the QAIF endpoint makes
#     GRAPH_OPEN fail; I2S_SINK is accepted
#   MODULE_FMT_DATA must be DATA_FORMAT_FIXED_POINT
#   without the PCM converter the graph starts but moves no data (16-bit
#     decoder output into the 32-bit sink)
