# Serve the modem its EFS from writable copies rather than read-only partitions.
#
# Upstream's unit is "rmtfs -r -P -s": -P uses the raw partitions and -r
# discards every write into a RAM shadow buffer while reporting success. Drop
# both and point -o at the copies fogona-modem-efs.service lays down, so the
# modem's EFS writes actually persist and the real partitions are never opened
# for writing. See /usr/sbin/fogona-modem-efs for the full reasoning.
#
# rmtfs also starts the modem (-s), so this is where the radio SKU is ordered
# in: fogona-mmi-radio publishes it to the kernel's mmi-unit-info block, which
# the modem reads during RF init. Wants, not Requires: without it the modem
# still boots and serves EFS and SMS, only RF stays down.
[Unit]
Requires=fogona-modem-efs.service
After=fogona-modem-efs.service
Wants=fogona-mmi-radio.service
After=fogona-mmi-radio.service

[Service]
ExecStart=
ExecStart=/usr/bin/rmtfs -o /var/lib/rmtfs -s
