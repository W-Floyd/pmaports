# Calls: the earpiece by default, the speakers for speakerphone. The same
# PCM and pin switches as HiFi.conf. callaudiod switches the card to the
# highest-priority "Voice Call" profile when a call starts. Speaker and
# Earpiece share a PCM, so PipeWire puts them in separate profiles, and
# callaudiod's in-call speaker toggle (a port switch) cannot reach Speaker.
#
# The earpiece amplifier takes the left channel only. Earpiece is therefore
# a mono split of the stereo PCM, on hardware channel 0: PipeWire downmixes
# whatever plays to it, instead of dropping the right channel. The DSP
# frontend does not take a 1-channel stream, so the split is done in
# PipeWire (UCM SplitPCM), not by opening the PCM mono.

Include.pcm_split.File "/common/pcm/split.conf"

Macro [
	{
		SplitPCM {
			Name "fogona_earpiece"
			Direction Playback
			Channels 1
			HWChannels 2
			HWChannelPos0 MONO
			HWChannelPos1 MONO
		}
	}
]

SectionVerb {
	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "Voice"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"

	EnableSequence [
		cset "name='Speaker Switch' 0"
		cset "name='Receiver Switch' 1"
	]

	DisableSequence [
		cset "name='Receiver Switch' 0"
	]

	Value {
		PlaybackPriority 100
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "fogona_earpiece"
		Direction Playback
		HWChannels 2
		Channels 1
		Channel0 0
		ChannelPos0 MONO
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	EnableSequence [
		cset "name='Speaker Switch' 1"
		cset "name='Receiver Switch' 1"
	]

	DisableSequence [
		cset "name='Speaker Switch' 0"
		cset "name='Receiver Switch' 0"
	]

	Value {
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}
