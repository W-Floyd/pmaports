# Calls: the earpiece by default, the speakers for speakerphone. The same
# PCM and pin switches as HiFi.conf. callaudiod switches the card to the
# highest-priority "Voice Call" profile when a call starts. Speaker and
# Earpiece share a PCM, so PipeWire puts them in separate profiles, and
# callaudiod's in-call speaker toggle (a port switch) cannot reach Speaker.
# The earpiece amplifier takes the left channel only; call audio is mono,
# which PipeWire copies to both channels. Stereo played here loses its
# right channel. A mono earpiece was tried two ways: SplitPCM on hardware
# channel 0, and relabelling this sink's channels MONO,AUX0. On
# PipeWire 1.6.8 / WirePlumber 0.5.17 streams then often never linked
# (format negotiation failed, -EINVAL), so the earpiece stays plain stereo.

SectionVerb {
	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "Voice"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"

	EnableSequence [
		cset "name='Speaker Switch' 0"
		cset "name='Receiver Switch' 1"
	]

	DisableSequence [
		cset "name='Receiver Switch' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	EnableSequence [
		cset "name='Speaker Switch' 1"
		cset "name='Receiver Switch' 1"
	]

	DisableSequence [
		cset "name='Speaker Switch' 0"
		cset "name='Receiver Switch' 0"
	]

	Value {
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}
