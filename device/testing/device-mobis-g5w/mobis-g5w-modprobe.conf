# The in-tree Telechips display driver is unfinished (no LVDS PHY init): loaded,
# it takes the LCD controller from simpledrm and GDM renders garbled. simpledrm
# on the bootloader's framebuffer is the display.
blacklist tcc803x_drm
blacklist tcc803x_drm_vioc
blacklist tcc803x_lvds
install tcc803x_drm /bin/true
install tcc803x_drm_vioc /bin/true
install tcc803x_lvds /bin/true
