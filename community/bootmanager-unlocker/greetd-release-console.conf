# The initramfs unlocker leaves the console in graphics mode, so its last
# frame ("Unlocking…") stays on the panel through the rest of the boot. The
# kernel will not switch away from such a console, and greetd switches to VT 7:
# give the console back first (a no-op when it is in text mode already).
[Service]
ExecStartPre=-/usr/bin/bootmanager-ui --release-console
